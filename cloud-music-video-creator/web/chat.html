<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cloud Music Video Creator - Chat</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; max-width: 1200px; }
        .chat-container { display: flex; height: 80vh; position: relative; }
        
        .chat-panel { display: flex; flex-direction: column; min-width: 200px; overflow: hidden; }
        .messages { flex: 1; border: 1px solid #ddd; padding: 15px; overflow-y: auto; background: #f9f9f9; }
        .input-area { display: flex; gap: 10px; margin-top: 10px; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; }
        .input-area button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        
        .resize-handle { width: 8px; background: #e0e0e0; cursor: col-resize; position: relative; }
        .resize-handle:hover { background: #007bff; }
        .resize-handle::after { content: '⋮⋮'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #666; font-size: 12px; }
        
        .komposition-panel { display: flex; flex-direction: column; min-width: 200px; overflow: hidden; }
        .komposition-title { font-weight: bold; margin-bottom: 10px; }
        .komposition-content { flex: 1; border: 1px solid #ddd; padding: 15px; font-family: monospace; white-space: pre-wrap; background: #fff; overflow-y: auto; }
        
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user-message { background: #e3f2fd; margin-left: 20px; }
        .assistant-message { background: #f1f8e9; margin-right: 20px; }
        .system-message { background: #fff3e0; font-style: italic; }
        
        .actions { margin-top: 10px; }
        .actions button { margin-right: 10px; padding: 8px 16px; background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎬 Cloud Music Video Creator - Creative Assistant</h1>
    
    <div class="chat-container">
        <div class="chat-panel" id="chatPanel">
            <h3>💬 Creative Discussion</h3>
            <div id="messages" class="messages">
                <div class="assistant-message message">
                    Hi! I'm here to help you create amazing music videos. Tell me about your vision - what kind of video do you want to create?
                </div>
            </div>
            <div class="input-area">
                <input id="userInput" type="text" placeholder="Describe your music video idea..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
        
        <div class="resize-handle" id="resizeHandle"></div>
        
        <div class="komposition-panel" id="kompositionPanel">
            <div class="komposition-title">📝 Current Komposition</div>
            <div id="komposition" class="komposition-content">
                No komposition created yet. Start the conversation to generate one!
            </div>
            <div class="actions">
                <button id="createVideo" onclick="createVideo()" disabled>🎬 Create Video</button>
                <button onclick="saveKomposition()">💾 Save Komposition</button>
            </div>
        </div>
    </div>

    <script>
        let currentKomposition = null;
        let conversationHistory = [];
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function addMessage(content, type = 'assistant') {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `${type}-message message`;
            messageDiv.textContent = content;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function addSystemMessage(content) {
            addMessage(content, 'system');
        }
        
        function addVideoCompleteMessage(videoUrl) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message message';
            
            // Extract filename from path for display
            const filename = videoUrl.split('/').pop();
            
            messageDiv.innerHTML = `🎉 Video completed! <a href="${videoUrl}" download="${filename}" style="color: #007bff; text-decoration: none; font-weight: bold;">📥 Download ${filename}</a>`;
            
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const userMessage = input.value.trim();
            if (!userMessage) return;
            
            // Add user message to chat
            addMessage(userMessage, 'user');
            conversationHistory.push({role: 'user', content: userMessage});
            input.value = '';
            
            try {
                // Send to LLM for processing
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: userMessage,
                        conversation_history: conversationHistory,
                        current_komposition: currentKomposition
                    })
                });
                
                const data = await response.json();
                
                // Debug logging
                console.log('API Response:', data);
                console.log('Response length:', data.response ? data.response.length : 'null');
                
                // Add LLM response
                addMessage(data.response);
                conversationHistory.push({role: 'assistant', content: data.response});
                
                // Update komposition if provided
                if (data.komposition) {
                    currentKomposition = data.komposition;
                    document.getElementById('komposition').textContent = data.komposition;
                    document.getElementById('createVideo').disabled = false;
                }
                
                // Handle any actions
                if (data.action === 'video_creation_started') {
                    addSystemMessage('🎬 Video creation started! Job ID: ' + data.job_id);
                    pollVideoStatus(data.job_id);
                }
                
            } catch (error) {
                addMessage('Sorry, I encountered an error: ' + error.message);
            }
        }
        
        async function createVideo() {
            if (!currentKomposition) {
                addSystemMessage('❌ No komposition available. Please discuss your video idea first.');
                return;
            }
            
            addSystemMessage('🎬 Starting video creation...');
            
            try {
                const response = await fetch('/api/create-video-from-komposition', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({komposition: currentKomposition})
                });
                
                const data = await response.json();
                addSystemMessage('✅ Video creation started! Job ID: ' + data.job_id);
                pollVideoStatus(data.job_id);
                
            } catch (error) {
                addSystemMessage('❌ Failed to start video creation: ' + error.message);
            }
        }
        
        async function pollVideoStatus(jobId) {
            const maxAttempts = 60;
            let attempts = 0;
            
            const poll = async () => {
                try {
                    const response = await fetch('/api/status/' + jobId);
                    const data = await response.json();
                    
                    addSystemMessage(`📊 ${data.message} (${data.progress}%)`);
                    
                    if (data.status === 'completed') {
                        addVideoCompleteMessage(data.video_url);
                    } else if (data.status === 'failed') {
                        addSystemMessage(`❌ Video creation failed: ${data.message}`);
                    } else if (attempts < maxAttempts) {
                        attempts++;
                        setTimeout(poll, 3000);
                    } else {
                        addSystemMessage('⏰ Video creation timed out');
                    }
                } catch (error) {
                    addSystemMessage('❌ Status check failed: ' + error.message);
                }
            };
            
            setTimeout(poll, 3000);
        }
        
        function saveKomposition() {
            if (!currentKomposition) {
                alert('No komposition to save');
                return;
            }
            
            const blob = new Blob([currentKomposition], {type: 'text/markdown'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'komposition.md';
            a.click();
            URL.revokeObjectURL(url);
            
            addSystemMessage('💾 Komposition saved to downloads');
        }
        
        // Initialize resize functionality
        function initializeResize() {
            const resizeHandle = document.getElementById('resizeHandle');
            const chatPanel = document.getElementById('chatPanel');
            const kompositionPanel = document.getElementById('kompositionPanel');
            const container = document.querySelector('.chat-container');
            
            let isResizing = false;
            let startX = 0;
            let startChatWidth = 0;
            let startKompositionWidth = 0;
            
            resizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startChatWidth = chatPanel.offsetWidth;
                startKompositionWidth = kompositionPanel.offsetWidth;
                
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                
                const dx = e.clientX - startX;
                const containerWidth = container.offsetWidth - 8; // minus handle width
                const newChatWidth = Math.max(200, Math.min(containerWidth - 200, startChatWidth + dx));
                const newKompositionWidth = containerWidth - newChatWidth;
                
                chatPanel.style.flex = 'none';
                chatPanel.style.width = newChatWidth + 'px';
                kompositionPanel.style.flex = 'none';
                kompositionPanel.style.width = newKompositionWidth + 'px';
            });
            
            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeResize);
        
        // Focus on input field
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
